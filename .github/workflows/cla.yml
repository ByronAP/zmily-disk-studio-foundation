name: Contributor agreement

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never check out or execute the contributor's branch with this token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify existing contributor acceptances
        env:
          CLA_GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/cla_check.py
