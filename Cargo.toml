[workspace]
resolver = "2"
members = ["crates/zmily-disk-studio-foundation"]

[workspace.package]
version = "0.3.0"
rust-version = "1.98.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.23.1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
